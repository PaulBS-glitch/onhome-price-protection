<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OnHome | Price Protection</title>
<style>
:root{--ink:#173d45;--teal:#235d54;--muted:#60747b;--copper:#a65b45;--paper:#f8f9f7;--line:#d8e1df}*{box-sizing:border-box}body{margin:0;background:#e8edeb;color:var(--ink);font-family:Inter,Arial,sans-serif;display:grid;place-items:center;min-height:100dvh}.stage{width:min(100vw,177.777dvh);height:min(100dvh,56.25vw);background:var(--paper);padding:3.1% 4%;display:flex;flex-direction:column;overflow:hidden}header,footer{display:flex;align-items:center;justify-content:space-between;gap:16px}header{padding-bottom:2%;border-bottom:1px solid var(--line)}.brand{font-size:clamp(20px,2.3vw,38px);font-weight:800;letter-spacing:-.07em}.eyebrow{font-size:clamp(9px,1vw,14px);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}.content{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:2.2vh}h1{font-size:clamp(22px,3.4vw,60px);line-height:1.07;letter-spacing:-.045em;margin:0;max-width:95%}.sub{font-size:clamp(12px,1.3vw,22px);line-height:1.4;color:var(--muted);margin:0;max-width:90%}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:3%;margin:1vh 0}.metric{border-top:2px solid var(--line);padding-top:12px;animation:rise .65s both}.metric:nth-child(2){animation-delay:.18s}.metric:nth-child(3){animation-delay:.36s}.metric h2{font-size:clamp(12px,1.35vw,22px);margin:0 0 4px}.metric svg{display:block;width:100%;height:clamp(55px,13vh,140px)}.metric strong{font-size:clamp(13px,1.65vw,28px);display:block}.metric small{color:var(--muted);font-size:clamp(9px,.95vw,14px)}.trace{stroke-dasharray:550;stroke-dashoffset:550;animation:draw 1.3s .3s forwards}.bar{transform-box:fill-box;transform-origin:bottom;animation:grow .8s both}.drivers{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.drivers span{padding:8px 12px;border:1px solid var(--line);font-size:clamp(10px,1vw,15px);border-radius:3px}.conclusion{background:var(--ink);color:white;padding:2% 2.5%;font-size:clamp(13px,1.65vw,27px);line-height:1.25;font-weight:600;animation:rise .7s .85s both}.note{font-size:clamp(8px,.8vw,12px);color:var(--muted)}footer{border-top:1px solid var(--line);padding-top:1.5%;margin-top:1%}button,select{font:inherit;font-size:clamp(10px,1vw,15px);padding:9px 13px;border:1px solid var(--line);background:white;color:var(--ink);border-radius:4px;cursor:pointer}button.primary{background:var(--ink);color:white;border-color:var(--ink)}button:disabled{opacity:.35;cursor:default}.nav{display:flex;gap:8px;align-items:center}.progress{display:flex;gap:5px;flex:1;max-width:260px}.progress i{height:4px;background:var(--line);flex:1}.progress i.active{background:var(--teal)}.placeholder{border:1px solid var(--line);padding:5%;background:white;color:var(--muted)}@keyframes draw{to{stroke-dashoffset:0}}@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}.trace{stroke-dashoffset:0}}@media(max-aspect-ratio:4/3){.stage{width:100%;height:auto;min-height:100dvh;padding:5%;overflow:visible}.content{gap:20px;padding:24px 0}.metrics{gap:12px}header,footer{flex-wrap:wrap}.progress{max-width:100px}.drivers{gap:6px}}
</style></head><body><main class="stage"><header><div class="brand">onhome.</div><div class="eyebrow">Price Protection / Strategic explainer</div></header><section class="content" id="content" aria-live="polite"></section><footer><span class="eyebrow" id="count"></span><div class="progress" id="progress" aria-hidden="true"></div><div class="nav"><button id="replay" title="Replay scene">Replay</button><button id="prev">Previous</button><select id="chapter" aria-label="Select chapter"></select><button class="primary" id="next">Next →</button><button id="full">Full screen</button></div></footer></main>
<script>
const chapters=['Market context','Market friction','The proposition','Transaction architecture','Worked example','Resolution and exit','Commercial model','Strategic opportunity'];let current=0;
const market=`<div class="eyebrow">01 / Market context and opportunity</div><h1>Changing market conditions can delay residential property transactions.</h1><p class="sub">Market corrections and economic uncertainty may amplify the risk buyers and sellers perceive in committing to a price today.</p><div class="metrics"><article class="metric"><h2>Property values</h2><svg viewBox="0 0 250 110" role="img" aria-label="Illustrative price correction"><path d="M5 100 H245" stroke="#d8e1df"/><path d="M5 81 L45 53 L85 22 L125 34 L165 52 L205 71 L245 88" fill="none" stroke="#a65b45" stroke-width="4" class="trace"/></svg><strong>Price correction</strong><small>Illustrative trend</small></article><article class="metric"><h2>Transaction activity</h2><svg viewBox="0 0 250 110" role="img" aria-label="Illustrative decline in transactions"><path d="M5 100 H245" stroke="#d8e1df"/>${[80,73,76,58,49,36].map((h,i)=>'<rect class="bar" x="'+(8+i*40)+'" y="'+(100-h)+'" width="26" height="'+h+'" fill="#78918e" style="animation-delay:'+i*.1+'s"/>').join('')}</svg><strong>Reduced activity</strong><small>Illustrative trend</small></article><article class="metric"><h2>Days on market</h2><svg viewBox="0 0 250 110" role="img" aria-label="Illustrative increase in selling times"><path d="M5 100 H245" stroke="#d8e1df"/><path d="M5 87 L45 79 L85 66 L125 70 L165 48 L205 30 L245 17" fill="none" stroke="#a65b45" stroke-width="4" class="trace"/></svg><strong>Longer selling periods</strong><small>Illustrative trend</small></article></div><div class="drivers"><b class="eyebrow">Potential drivers</b><span>Interest rates</span><span>Economic uncertainty</span><span>Affordability</span><span>Policy changes</span></div><div class="conclusion">The current market provides a catalyst. Structural pricing uncertainty creates the longer-term opportunity.</div><div class="note">Conceptual charts only; no historical data represented. Replace with dated, verified Australian market evidence before external presentation.</div>`;
const el=id=>document.getElementById(id);chapters.forEach((c,i)=>{const o=document.createElement('option');o.value=i;o.textContent=(i+1)+'. '+c;el('chapter').append(o)});
function render(){el('content').innerHTML=current===0?market:'<div class="eyebrow">Scene '+String(current+1).padStart(2,'0')+'</div><h1>'+chapters[current]+'</h1><div class="placeholder">Reserved for the next development stage.</div>';el('count').textContent=String(current+1).padStart(2,'0')+' / 08';el('progress').innerHTML=chapters.map((_,i)=>'<i class="'+(i===current?'active':'')+'"></i>').join('');el('chapter').value=current;el('prev').disabled=current===0;el('next').disabled=current===7}
function go(n){current=Math.min(7,Math.max(0,n));render()}el('prev').onclick=()=>go(current-1);el('next').onclick=()=>go(current+1);el('chapter').onchange=e=>go(Number(e.target.value));el('replay').onclick=render;el('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){}};document.addEventListener('keydown',e=>{if(['SELECT','BUTTON','INPUT'].includes(e.target.tagName))return;if(e.key==='ArrowRight')go(current+1);if(e.key==='ArrowLeft')go(current-1)});render();
</script></body></html>
